name: Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release AAB (needs the keystore secrets)"
        type: boolean
        default: false
      publish:
        description: "Upload the AAB to the Google Play internal track (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.6.1-stable
            ~/.cache/godot-templates
            ~/.local/share/godot/export_templates
          key: godot-4.6.1-stable-linux-templates-v1
      - name: Bootstrap Godot, templates and project import
        run: godot/tools/bootstrap.sh --templates
      - name: Android SDK packages (versions pinned from the Godot template)
        run: godot/tools/setup_android_sdk.sh
      - name: Version numbers
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=0.1.0-dev.${{ github.run_number }}" >> "$GITHUB_ENV"; fi
      - name: Debug APK (installable on a phone)
        run: godot/tools/export_android.sh apk
      - name: Report what the debug APK contains
        run: |
          APK=godot/build/android/quantum-teleportar.apk
          ls -l "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk_files.txt"
          echo "files in the APK: $(wc -l < "$RUNNER_TEMP/apk_files.txt")"
          echo "3D models (imported glb): $(grep -c '\.glb-.*\.scn$' "$RUNNER_TEMP/apk_files.txt")"
          grep '\.glb-.*\.scn$' "$RUNNER_TEMP/apk_files.txt" | sed 's#.*/##; s#\.glb-.*##' | sort | tr '\n' ' '; echo
          echo "textures (.ctex): $(grep -c '\.ctex$' "$RUNNER_TEMP/apk_files.txt")"
          echo "audio samples: $(grep -c '\.sample$' "$RUNNER_TEMP/apk_files.txt")"
          echo "scripts: $(grep -Ec '\.gdc$|\.gd$' "$RUNNER_TEMP/apk_files.txt")  shaders: $(grep -Ec '\.gdshader' "$RUNNER_TEMP/apk_files.txt")"
          echo "touch controls scene present: $(grep -c 'touch_controls' "$RUNNER_TEMP/apk_files.txt") entries"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: godot/build/android/quantum-teleportar.apk

  # Signed release build. Skips cleanly (green, no signing steps run) when the keystore secrets are absent.
  # Runs only on tags v* or when "release" is ticked in a manual run. versionCode = github.run_number.
  release:
    needs: android
    if: ${{ inputs.release == true || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check signing secrets
        id: gate
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not set; skipping the signed release (see docs/RELEASE.md)."
          fi
          if [ -n "$PLAY" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; else echo "play=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.signed == 'true'
        with:
          persist-credentials: false                # the Play upload action below is third-party: it must not find the token in .git/config
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.signed == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Godot and export templates
        if: steps.gate.outputs.signed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.6.1-stable
            ~/.cache/godot-templates
            ~/.local/share/godot/export_templates
          key: godot-4.6.1-stable-linux-templates-v1
      - name: Bootstrap Godot, templates and project import
        if: steps.gate.outputs.signed == 'true'
        run: godot/tools/bootstrap.sh --templates
      - name: Android SDK packages
        if: steps.gate.outputs.signed == 'true'
        run: godot/tools/setup_android_sdk.sh
      - name: Version numbers
        if: steps.gate.outputs.signed == 'true'
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=0.1.0-rc.${{ github.run_number }}" >> "$GITHUB_ENV"; fi
      - name: Decode upload keystore
        if: steps.gate.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          chmod 600 "$RUNNER_TEMP/upload.keystore"
          # Only the file's path goes to GITHUB_ENV. The alias and the password are given to the two export steps below through their own env:, so no other step
          # (the third-party Play upload included) inherits them.
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          # Godot takes one password for the release keystore; tools/release/ documents that store and key password must match (docs/RELEASE.md).
          if [ "$KEYSTORE_PW" != "$KEY_PW" ]; then echo "::warning::ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD differ; Godot uses the key password. Create the keystore with identical passwords (docs/RELEASE.md)."; fi
      - name: Signed release AAB (Google Play)
        if: steps.gate.outputs.signed == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: godot/tools/export_android.sh aab
      - name: Signed release APK (sideload / testers)
        if: steps.gate.outputs.signed == 'true'
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BIN="$(tools/get_godot.sh)"
          "$BIN" --headless --path . --export-release "Android" build/android/quantum-teleportar-release.apk
          test -s build/android/quantum-teleportar-release.apk
          ls -l build/android
      - name: Check the release is ready (size, version, presets)
        if: steps.gate.outputs.signed == 'true'
        run: godot/tools/release/check_release_ready.sh --built godot/build/android
      - name: Keep the signed AAB and APK (private repositories only; artifacts of public repositories are downloadable by anyone)
        if: steps.gate.outputs.signed == 'true' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            godot/build/android/quantum-teleportar.aab
            godot/build/android/quantum-teleportar-release.apk
      - name: Remove the decoded keystore (also when a build step failed)
        if: ${{ always() && steps.gate.outputs.signed == 'true' }}
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - name: Publish to Google Play (internal testing track)
        if: steps.gate.outputs.signed == 'true' && steps.gate.outputs.play == 'true' && (inputs.publish == true || startsWith(github.ref, 'refs/tags/v'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.quantumteleportar.app
          releaseFiles: godot/build/android/quantum-teleportar.aab
          track: internal
          status: completed
