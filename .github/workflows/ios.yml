name: iOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed App Store .ipa (needs the signing secrets)"
        type: boolean
        default: false
      testflight:
        description: "Upload the .ipa to TestFlight (needs the App Store Connect API key secrets)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAVE_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' && secrets.IOS_BUNDLE_ID != '' }}
      HAVE_ASC: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
      WANT_RELEASE: ${{ inputs.release == true || startsWith(github.ref, 'refs/tags/v') }}
      WANT_TESTFLIGHT: ${{ inputs.testflight == true || startsWith(github.ref, 'refs/tags/v') }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.6.1-stable
            ~/.cache/godot-templates
            ~/Library/Application Support/Godot/export_templates
          key: godot-4.6.1-stable-macos-templates-v1
      - name: Bootstrap Godot, templates and project import
        run: godot/tools/bootstrap.sh --templates
      - name: Version numbers
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=0.1.0" >> "$GITHUB_ENV"; fi
      - name: Generate the Xcode project
        run: godot/tools/export_ios.sh
      - name: Unsigned simulator build (proves the project compiles; needs no secrets)
        run: godot/tools/ios_build.sh simulator
      - name: Signed App Store .ipa
        if: env.HAVE_SIGNING == 'true' && env.WANT_RELEASE == 'true'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: godot/tools/ios_build.sh ipa
      - uses: actions/upload-artifact@v4
        if: env.HAVE_SIGNING == 'true' && env.WANT_RELEASE == 'true'
        with:
          name: ios-ipa
          path: godot/build/ios/ipa/*.ipa
      - name: Upload to TestFlight
        if: env.HAVE_SIGNING == 'true' && env.HAVE_ASC == 'true' && env.WANT_RELEASE == 'true' && env.WANT_TESTFLIGHT == 'true'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: godot/build/ios/ipa/QuantumTeleportar.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
